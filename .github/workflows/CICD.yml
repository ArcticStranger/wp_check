name: GameStore Deploy

on:
  push:
    branches:
      - dev
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_PATH: ${{ github.event_name == 'push' && 'public_html/dev.arcticobserver.com' || 'public_html/live.arcticobserver.com' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare WordPress Zip
      run: |
        WP_LINK=$(cat wp-version-contol.cfg)
        wget -O "./wordpress.zip" "$WP_LINK"

    - name: Prepare plugins and theme zip
      run: zip -r wpcontent.zip plugins mu-plugins themes

    - name: Copy Zips to Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        source: |
          ./wordpress.zip
          ./wpcontent.zip
        target: ${{ env.DEPLOY_PATH }}

    - name: Enable Maintenance Mode
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        source: ".maintenance"
        target: ${{ env.DEPLOY_PATH }}

    - name: Update WordPress Core
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd "${{ env.DEPLOY_PATH }}"
          find . -type f -name "*.php" ! -name "wp-config.php" -delete
          rm -rf wp-admin wp-includes
          unzip -o wordpress.zip -d .
          cp -r wordpress/. .
          rm -rf wordpress

    - name: Update Plugins and Theme
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd "${{ env.DEPLOY_PATH }}"
          rm -rf wp-content/plugins wp-content/mu-plugins wp-content/themes
          unzip -o wpcontent.zip -d wp-content/

    - name: Disable Maintenance Mode and Remove zips
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd "${{ env.DEPLOY_PATH }}"
          rm -f .maintenance
          rm -f wpcontent.zip
          rm -f wordpress.zip